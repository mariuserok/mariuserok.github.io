<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marius</title>
    <style>
      :root {
        --fg: #e6fbff;
        --glow: #7dd3fc;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        background: #05060a;
        font-family: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo,
          Consolas, "Liberation Mono", monospace;
        overflow: hidden;
      }

      h1 {
        display: flex;
        align-items: baseline;
        font-size: clamp(2.2rem, 11vw, 7rem);
        font-weight: 400;
        letter-spacing: 0.12em;
        color: var(--fg);
        text-shadow:
          0 0 8px rgba(230, 251, 255, 0.35),
          0 0 26px var(--glow),
          0 0 70px rgba(125, 211, 252, 0.45);
        cursor: default;
        user-select: none;
      }

      .prompt {
        color: var(--glow);
        opacity: 0.6;
        margin-right: 0.5em;
      }

      /* Reserves the full width so the cursor does not drift while typing. */
      .name {
        display: inline-block;
      }

      .name span {
        display: inline-block;
        min-width: 0.62em;
      }

      .cursor {
        width: 0.56em;
        height: 0.92em;
        margin-left: 0.1em;
        background: var(--fg);
        box-shadow: 0 0 14px var(--glow);
        animation: blink 1.05s steps(1, end) infinite;
      }

      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cursor {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <h1 id="line">
      <span class="prompt">&gt;</span><span class="name" id="name"></span
      ><span class="cursor" aria-hidden="true"></span>
    </h1>

    <script>
      const NAME = "Marius";
      const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&$@/\\<>*+=-_";
      const nameEl = document.getElementById("name");
      const letters = [...NAME].map((ch) => {
        const el = document.createElement("span");
        el.dataset.char = ch;
        nameEl.appendChild(el);
        return el;
      });

      const rand = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let frame = 0;
      let busy = false;

      /** Scrambles each letter, then locks them in from left to right. */
      function scramble({
        revealFrom = 0,
        limit = letters.length,
        perLetter = 5,
        tail = 3,
      } = {}) {
        cancelAnimationFrame(frame);
        busy = true;
        let tick = 0;
        const run = () => {
          let settled = true;
          letters.forEach((el, i) => {
            if (i >= limit) {
              el.textContent = "";
              return;
            }
            if (i < revealFrom) {
              el.textContent = el.dataset.char;
              return;
            }
            const done = tick >= (i - revealFrom) * perLetter + tail;
            el.textContent = done ? el.dataset.char : rand();
            if (!done) settled = false;
          });
          tick++;
          if (settled) busy = false;
          else frame = requestAnimationFrame(run);
        };
        run();
      }

      if (reduced) {
        letters.forEach((el) => (el.textContent = el.dataset.char));
      } else {
        // Type the name out, scrambling each new character before it settles.
        let typed = 0;
        letters.forEach((el) => (el.textContent = ""));
        const type = () => {
          typed++;
          scramble({
            revealFrom: typed - 1,
            limit: typed,
            perLetter: 0,
            tail: 6,
          });
          if (typed < letters.length) setTimeout(type, 130);
        };
        setTimeout(type, 400);

        document.getElementById("line").addEventListener("mouseenter", () => {
          if (!busy) scramble({ perLetter: 2, tail: 10 });
        });
      }
    </script>
  </body>
</html>
