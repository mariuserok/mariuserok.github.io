<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marius</title>
    <style>
      :root {
        --glow: #7dd3fc;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        background: #05060a;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }

      /* Soft radial wash behind the name. */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(125, 211, 252, 0.1), transparent 55%);
        pointer-events: none;
      }

      h1 {
        position: relative;
        font-size: clamp(3rem, 18vw, 11rem);
        font-weight: 300;
        letter-spacing: 0.28em;
        text-indent: 0.28em;
        color: #f2fbff;
        text-shadow:
          0 0 10px rgba(242, 251, 255, 0.55),
          0 0 30px var(--glow),
          0 0 70px var(--glow),
          0 0 140px rgba(125, 211, 252, 0.6);
        animation: pulse 4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.88;
          text-shadow:
            0 0 10px rgba(242, 251, 255, 0.5),
            0 0 28px var(--glow),
            0 0 60px var(--glow),
            0 0 120px rgba(125, 211, 252, 0.5);
        }
        50% {
          opacity: 1;
          text-shadow:
            0 0 14px rgba(242, 251, 255, 0.8),
            0 0 40px var(--glow),
            0 0 90px var(--glow),
            0 0 180px rgba(125, 211, 252, 0.75);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        h1 {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <h1>Marius</h1>
  </body>
</html>
